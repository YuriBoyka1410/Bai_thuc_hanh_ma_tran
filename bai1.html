<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bài thực thành 3</title>
  </head>
  <body>
    <script>
      for (let i = 1; i <= 10; i++) {
        for (let j = 1; j <= 10; j++) {
          document.write(i * j + " ");
        }
        document.write("<br />");
      }
      document.write("<br />");
      //While
      let i = 1;
      let j = 1;
      while (i <= 10) {
        while (j <= 10) {
          document.write(i * j + " ");
          j++;
        }
        j = 1;
        i++;
        document.write("<br>");
      }
    </script>
  </body>
</html>
