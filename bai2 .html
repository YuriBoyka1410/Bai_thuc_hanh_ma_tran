<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bai thực hành 2</title>
  </head>
  <body>
    <script>
      //While
      let i = 1;
      let j = 1;
      while (i <= 10) {
        while (j <= 10) {
          document.write(i * j + " ");
          j++;
        }
        j = 1;
        i++;
        document.write("<br>");
      }
    </script>
  </body>
</html>
